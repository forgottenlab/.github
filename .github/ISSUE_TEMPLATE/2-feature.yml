name: 功能 / Feature
description: 希望增加或改变的行为。A behavior you want added or changed.
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        维护者的标题和正文采用项目维护交流语言。优先遵循项目声明，其次参考维护者结合项目文档作出的判断。仍无法确定时用简体中文。
        维护者撰写中文 Issue 时，在正文末尾附简短的 **English Summary**。外部贡献者可用英文或简体中文，英文摘要可选。

        Maintainers use the project's maintenance language for the title and body. Follow the project's declaration first, then the maintainer's judgment based on project docs. If neither determines a language, use Simplified Chinese.
        End maintainer-written Chinese issues with a brief **English Summary**. External contributors can use English or Simplified Chinese, with an optional English summary.
  - type: textarea
    id: need
    attributes:
      label: 要解决的问题 / Need
      description: 说明当前的问题；标题直接描述需求，无需前缀。Describe the current gap; use a descriptive title without a prefix.
      placeholder: 当前的问题 / The current gap
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 设想 / Idea
      description: 简述已有设想，可以留空。Briefly describe a possible approach; optional.
    validations:
      required: false
