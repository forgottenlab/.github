name: 功能 / Feature
description: 希望增加或改变的行为。A behavior you want added or changed.
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        ForgottenLab 维护者默认用简体中文撰写正文。中文 Issue 末尾添加简短的 **English Summary**，概括要点即可。
        外部贡献者可使用英文或简体中文，英文摘要可选。全文翻译均为可选。

        ForgottenLab maintainers write issue bodies in Simplified Chinese by default. End Chinese issues with a brief **English Summary** of the main points.
        External contributors can use English or Simplified Chinese. An English summary is optional for them. Full translations are optional for everyone.
  - type: textarea
    id: need
    attributes:
      label: 要解决的问题 / Need
      description: 说明当前的问题；标题直接描述需求，无需前缀。Describe the current gap; use a descriptive title without a prefix.
      placeholder: 当前的问题 / The current gap
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 设想 / Idea
      description: 简述已有设想，可以留空。Briefly describe a possible approach; optional.
    validations:
      required: false
