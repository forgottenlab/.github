name: 功能 / Feature
description: 希望增加或改变的行为。A behavior you want added or changed.
type: Feature
body:
  - type: textarea
    id: need
    attributes:
      label: 要解决的问题 / Need
      description: 现在缺什么，或哪里不顺手。用描述性标题，不必加前缀。
      placeholder: 当前的问题 / The current gap
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 设想 / Idea
      description: 如果已有做法，简要写上。可以留空。
    validations:
      required: false
