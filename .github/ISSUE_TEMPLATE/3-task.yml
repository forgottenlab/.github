name: 任务 / Task
description: 一件待办，不一定是缺陷或新功能。Work that is neither a bug nor a feature.
type: Task
body:
  - type: markdown
    attributes:
      value: |
        维护者的标题和正文采用项目维护交流语言。优先遵循项目声明，其次参考维护者结合项目文档作出的判断。仍无法确定时用简体中文。
        维护者撰写中文 Issue 时，在正文末尾附简短的 **English Summary**。外部贡献者可用英文或简体中文，英文摘要可选。

        Maintainers use the project's maintenance language for the title and body. Follow the project's declaration first, then the maintainer's judgment based on project docs. If neither determines a language, use Simplified Chinese.
        End maintainer-written Chinese issues with a brief **English Summary**. External contributors can use English or Simplified Chinese, with an optional English summary.
  - type: textarea
    id: work
    attributes:
      label: 要做的事 / Work
      description: 说明要做什么及完成条件；标题无需前缀。Describe the work and how to tell it is done; no title prefix needed.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 测试或验证结果 / Test or verification results
      description: >-
        简述执行了哪些检查、通过或失败情况和结论，可附相关 Commit、Issue 或 PR 链接。
        Summarize what you checked, what passed or failed, and your conclusion. Link related commits, issues, or pull requests as useful.
    validations:
      required: false
  - type: upload
    id: evidence
    attributes:
      label: 测试报告与附件 / Test reports and attachments
      description: >-
        可附已脱敏的报告、日志、截图或实验数据。
        Attach redacted reports, logs, screenshots, or experiment data if available.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.svg,.webp,.pdf,.log,.txt,.json,.csv,.zip,.docx,.xlsx"
