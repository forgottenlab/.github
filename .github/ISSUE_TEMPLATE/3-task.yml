name: 任务 / Task
description: 一件待办，不一定是缺陷或新功能。Work that is neither a bug nor a feature.
type: Task
body:
  - type: markdown
    attributes:
      value: |
        ForgottenLab 维护者默认用简体中文撰写正文。中文 Issue 末尾添加简短的 **English Summary**，概括要点即可。
        外部贡献者可使用英文或简体中文，英文摘要可选。全文翻译均为可选。

        ForgottenLab maintainers write issue bodies in Simplified Chinese by default. End Chinese issues with a brief **English Summary** of the main points.
        External contributors can use English or Simplified Chinese. An English summary is optional for them. Full translations are optional for everyone.
  - type: textarea
    id: work
    attributes:
      label: 要做的事 / Work
      description: 说明要做什么及完成条件；标题无需前缀。Describe the work and how to tell it is done; no title prefix needed.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 测试或验证结果 / Test or verification results
      description: >-
        简述执行了哪些检查、通过或失败情况和结论，可附相关 Commit、Issue 或 PR 链接。
        Summarize what you checked, what passed or failed, and your conclusion. Link related commits, issues, or pull requests as useful.
    validations:
      required: false
  - type: upload
    id: evidence
    attributes:
      label: 测试报告与附件 / Test reports and attachments
      description: >-
        可附已脱敏的报告、日志、截图或实验数据。
        Attach redacted reports, logs, screenshots, or experiment data if available.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.svg,.webp,.pdf,.log,.txt,.json,.csv,.zip,.docx,.xlsx"
