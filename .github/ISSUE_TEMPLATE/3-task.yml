name: 任务 / Task
description: 一件待办，不一定是缺陷或新功能。Work that is neither a bug nor a feature.
type: Task
body:
  - type: markdown
    attributes:
      value: |
        公开技术项目的维护者优先用简洁、描述性的英文标题。有明确的项目标题语言约定时，以项目约定为准。
        正文可用简体中文或英文。维护者用中文写正文时，在末尾附简短的 **English Summary**。
        外部贡献者的标题与正文可用英文或简体中文，英文摘要可选。这里的语言建议不作强制校验。

        Maintainers of public technical projects should prefer a concise, descriptive English title. Follow any explicit project policy for title language.
        Use English or Simplified Chinese for the body. End a maintainer-written Chinese body with a brief **English Summary**.
        External contributors can use English or Simplified Chinese for titles and bodies, with an optional English summary. This guidance adds no language checks.
  - type: textarea
    id: work
    attributes:
      label: 要做的事 / Work
      description: 说明要做什么及完成条件；标题无需前缀。Describe the work and how to tell it is done; no title prefix needed.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 测试或验证结果 / Test or verification results
      description: >-
        简述执行了哪些检查、通过或失败情况和结论，可附相关 Commit、Issue 或 PR 链接。
        Summarize what you checked, what passed or failed, and your conclusion. Link related commits, issues, or pull requests as useful.
    validations:
      required: false
  - type: upload
    id: evidence
    attributes:
      label: 测试报告与附件 / Test reports and attachments
      description: >-
        可附已脱敏的报告、日志、截图或实验数据。
        Attach redacted reports, logs, screenshots, or experiment data if available.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.svg,.webp,.pdf,.log,.txt,.json,.csv,.zip,.docx,.xlsx"
