name: 缺陷 / Bug
description: 某个行为不符合预期。Something does not work as expected.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        维护者的标题和正文采用项目维护交流语言。优先遵循项目声明，其次参考维护者结合项目文档作出的判断。仍无法确定时用简体中文。
        维护者撰写中文 Issue 时，在正文末尾附简短的 **English Summary**。外部贡献者可用英文或简体中文，英文摘要可选。

        Maintainers use the project's maintenance language for the title and body. Follow the project's declaration first, then the maintainer's judgment based on project docs. If neither determines a language, use Simplified Chinese.
        End maintainer-written Chinese issues with a brief **English Summary**. External contributors can use English or Simplified Chinese, with an optional English summary.
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么 / What happened
      description: 写出实际与预期结果；标题直接描述问题，无需前缀。Describe actual and expected results; use a descriptive title without a prefix.
      placeholder: 实际结果与预期结果 / Actual and expected results
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现 / Steps
      description: 版本、系统和关键步骤，可以留空。Version, operating system, and key steps; optional.
      placeholder: |
        1.
        2.
    validations:
      required: false
  - type: upload
    id: evidence
    attributes:
      label: 测试证据 / Test evidence
      description: >-
        可附截图、日志或测试报告。请先移除密钥、令牌、隐私数据和未脱敏的内部配置。
        Attach screenshots, logs, or test reports if available. Remove secrets, tokens, private data, and sensitive internal configuration before uploading.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.svg,.webp,.pdf,.log,.txt,.json,.csv,.zip,.docx,.xlsx"
