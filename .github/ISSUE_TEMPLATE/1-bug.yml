name: 缺陷 / Bug
description: 某个行为不符合预期。Something does not work as expected.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        公开技术项目的维护者优先用简洁、描述性的英文标题。有明确的项目标题语言约定时，以项目约定为准。
        正文可用简体中文或英文。维护者用中文写正文时，在末尾附简短的 **English Summary**。
        外部贡献者的标题与正文可用英文或简体中文，英文摘要可选。这里的语言建议不作强制校验。

        Maintainers of public technical projects should prefer a concise, descriptive English title. Follow any explicit project policy for title language.
        Use English or Simplified Chinese for the body. End a maintainer-written Chinese body with a brief **English Summary**.
        External contributors can use English or Simplified Chinese for titles and bodies, with an optional English summary. This guidance adds no language checks.
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么 / What happened
      description: 写出实际与预期结果；标题直接描述问题，无需前缀。Describe actual and expected results; use a descriptive title without a prefix.
      placeholder: 实际结果与预期结果 / Actual and expected results
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现 / Steps
      description: 版本、系统和关键步骤，可以留空。Version, operating system, and key steps; optional.
      placeholder: |
        1.
        2.
    validations:
      required: false
  - type: upload
    id: evidence
    attributes:
      label: 测试证据 / Test evidence
      description: >-
        可附截图、日志或测试报告。请先移除密钥、令牌、隐私数据和未脱敏的内部配置。
        Attach screenshots, logs, or test reports if available. Remove secrets, tokens, private data, and sensitive internal configuration before uploading.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.svg,.webp,.pdf,.log,.txt,.json,.csv,.zip,.docx,.xlsx"
