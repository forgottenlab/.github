name: 缺陷 / Bug
description: 某个行为不符合预期。Something does not work as expected.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        ForgottenLab 维护者默认用简体中文撰写正文。中文 Issue 末尾添加简短的 **English Summary**，概括要点即可。
        外部贡献者可使用英文或简体中文，英文摘要可选。全文翻译均为可选。

        ForgottenLab maintainers write issue bodies in Simplified Chinese by default. End Chinese issues with a brief **English Summary** of the main points.
        External contributors can use English or Simplified Chinese. An English summary is optional for them. Full translations are optional for everyone.
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么 / What happened
      description: 写出实际与预期结果；标题直接描述问题，无需前缀。Describe actual and expected results; use a descriptive title without a prefix.
      placeholder: 实际结果与预期结果 / Actual and expected results
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现 / Steps
      description: 版本、系统和关键步骤，可以留空。Version, operating system, and key steps; optional.
      placeholder: |
        1.
        2.
    validations:
      required: false
  - type: upload
    id: evidence
    attributes:
      label: 测试证据 / Test evidence
      description: >-
        可附截图、日志或测试报告。请先移除密钥、令牌、隐私数据和未脱敏的内部配置。
        Attach screenshots, logs, or test reports if available. Remove secrets, tokens, private data, and sensitive internal configuration before uploading.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.svg,.webp,.pdf,.log,.txt,.json,.csv,.zip,.docx,.xlsx"
