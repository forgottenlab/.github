name: 缺陷 / Bug
description: 某个行为不符合预期。Something does not work as expected.
type: Bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么 / What happened
      description: 写出实际结果，以及你预期的结果。用描述性标题，不必加前缀。
      placeholder: 实际结果 / Actual result
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现 / Steps
      description: 版本、系统和关键步骤。可以留空。
      placeholder: |
        1.
        2.
    validations:
      required: false
